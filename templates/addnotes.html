<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
  {% extends 'dashboard.html' %}

{% block addcss %}
    <title>Add Notes</title>
    <link rel="stylesheet" href="{{url_for('static',filename='addnotes.css')}}">
{% endblock %}

{% block content %}
<div class="note-container">
    <h1>Create a New Note</h1>
    <form method="post">
        <div class="form-group">
            <label for="title">Title:</label>
            <input type="text" id="title" name="title" placeholder="Enter note title..." required>
        </div>
        
        <div class="form-group">
            <label for="description">Description:</label>
            <textarea id="description" name="description" placeholder="Write your note here..." required></textarea>
        </div>
        
        <button type="submit" class="btn">Save Note</button>
    </form>
</div>
{% endblock %}
</html>
