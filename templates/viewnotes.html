<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
  {% extends 'dashboard.html' %}

{% block addcss %}
    <title>View/Update Note</title>
    <link rel="stylesheet" href="{{url_for('static',filename='addnotes.css')}}">
{% endblock %}

{% block content %}
<div class="note-container">
    <h1>View Your Note</h1>
    <form method="post">
        <div class="form-group">
            <label for="title">Title:</label>
            <input type="text" id="title" name="title" value="{{notedata[1]}}" required>
        </div>
        
        <div class="form-group">
            <label for="description">Description:</label>
            <textarea id="description" name="description" required>{{notedata[2]}}</textarea>
        </div>

        <div class="form-group">
            <p><strong>Created on:</strong> {{notedata[3]}}</p>
        </div>
        
        <button type="submit" class="btn">Update Note</button>
    </form>
</div>
{% endblock %}
</html>
